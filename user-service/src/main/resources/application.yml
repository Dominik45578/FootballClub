server:
  port: ${USER_SERVICE_PORT:12004}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_NAME:localhost}:${EUREKA_PORT:8761}/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

spring:
  rabbitmq:
    host: ${RABBIT_CONTAINER:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        # Automatic acknowledgment mode
        acknowledge-mode: auto
        # Number of concurrent consumers
        concurrency: 1
        max-concurrency: 5
        # Retry configuration
        retry:
          enabled: true
          initial-interval: 3000  # 3 seconds
          max-attempts: 3
          max-interval: 10000     # 10 seconds
          multiplier: 2.0
  application:
    name: ${USER_SERVICE_NAME:user-service}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:mysql://${DB_CONTAINER:localhost}:${DB_PORT:3306}/${DB_TEAM_MEMBER_NAME:team_member_db}${DB_PARAMETERS:?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

grpc:
  identify:
    host: ${IDENTIFY_NAME:}
    port: ${IDENTIFY_GRPC_PORT:9092}
  server:
      port: ${USER_SERVER_GRPC_PORT:9094}