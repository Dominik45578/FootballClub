spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:mysql://${DB_CONTAINER:localhost}:${DB_PORT:3306}/${DB_MATCH_NAME:football_match_db}${DB_PARAMETERS:?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  application:
    name: ${MATCH_SERVICE_NAME:match-service}

server:
  port: ${MATCH_SERVICE_PORT:12005}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://${EUREKA_NAME:localhost}:${EUREKA_PORT:8761}/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name:match-service}:${server.port:12005}

logging:
  level:
    com.polibuda.footballclub.match-service: DEBUG
    org.springframework.security: DEBUG

grpc:
  football-data:
    host: football-external-data-service
    port: ${FED_GRPC_PORT:9090}
  user-service:
    host: ${USER_SERVICE_NAME:user-service}
    port : ${USER_SERVER_GRPC_PORT:9095}